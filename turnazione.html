<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, orderBy, limit }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8RyTJgSj5U8DA-T7nPzRIzfYqfzoRhn8",
  authDomain: "turnazione-2722d.firebaseapp.com",
  projectId: "turnazione-2722d",
  storageBucket: "turnazione-2722d.firebasestorage.app",
  messagingSenderId: "940298778130",
  appId: "1:940298778130:web:923caafd0596e861984acb",
  measurementId: "G-6G952ZHRP3"
};

window._fbReady = new Promise(resolve => {
  try {
    const fbApp = initializeApp(firebaseConfig);
    const db = getFirestore(fbApp);
    const DB_DOC = doc(db, 'app', 'data');

    window._fbSave = async (data) => { await setDoc(DB_DOC, data); };

    window._fbLoad = async () => {
      const snap = await getDoc(DB_DOC);
      return snap.exists() ? snap.data() : null;
    };

    // Backup a rotazione: un documento per giorno del mese, quindi al massimo
    // 31 copie che si sovrascrivono di mese in mese. Nessuna crescita infinita.
    window._fbBackup = async (data) => {
      const gg = 'g' + String(new Date().getDate()).padStart(2, '0');
      await setDoc(doc(db, 'backups', gg), data);
    };

    window._fbListBackups = async () => {
      const snap = await getDocs(query(collection(db, 'backups'), orderBy('ts', 'desc'), limit(40)));
      return snap.docs.map(d => ({ id: d.id, ts: d.data().ts, blob: d.data().blob }));
    };
  } catch(e) {
    console.error('Firebase init error:', e);
  }
  resolve();
});
</script>

<script>
// ══════════════════════════════════════════════════════════════════════════
//  CONFIGURAZIONE
// ══════════════════════════════════════════════════════════════════════════
// Il link della pagina è pubblico. Di default chi lo apre può SOLO GUARDARE.
// Per modificare i turni serve questo codice.
// ATTENZIONE, onestà: il codice sorgente della pagina è pubblico, quindi chi lo
// legge lo trova. Non è una password vera. Serve a impedire i danni ACCIDENTALI,
// che sono quello che è successo davvero. La protezione seria sono le regole di
// sicurezza di Firestore.
const CODICE_MODIFICA = 'primativvu2026';   // <-- CAMBIALO
const SOLA_LETTURA_ATTIVA = true;           // metti false per disattivare del tutto il blocco

// ── CONSTANTS ──
const BUILTINS=[
  {id:'riposo',     nome:'Assente',           colore:'#ef4444',oraInizio:'',     oraFine:''     },
  {id:'mattina',    nome:'Turno Mattina',     colore:'#94a3b8',oraInizio:'09:00',oraFine:'14:00'},
  {id:'intermezzo', nome:'Turno Intermezzo',  colore:'#0ea5e9',oraInizio:'13:00',oraFine:'20:00'},
  {id:'pomeriggio', nome:'Turno Pomeriggio',  colore:'#94a3b8',oraInizio:'15:30',oraFine:'20:30'},
  {id:'intero',     nome:'Turno Intero',      colore:'#475569',oraInizio:'09:00',oraFine:'20:00'},
  {id:'trasferta',  nome:'Trasferta',         colore:'#b45309',oraInizio:'',     oraFine:''     },
];
const GN=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const GF=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MN=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const BUILTIN_IDS=new Set(BUILTINS.map(b=>b.id));
const RUOLI_TECNICI=['Regista','Produzione','Cameraman','Montatore'];
const RUOLI_GIORNALISTI=['Giornalista'];
function ruoliForCat(cat){return cat==='giornalisti'?RUOLI_GIORNALISTI:RUOLI_TECNICI;}
function ruoloRank(cat,ruolo){const arr=ruoliForCat(cat);const i=arr.indexOf(ruolo);return i<0?arr.length:i;}
const NOTE_COLORS=['#6366f1','#8b5cf6','#ec4899','#ef4444','#f97316','#f59e0b','#22c55e','#10b981','#06b6d4','#3b82f6','#64748b','#b45309','#be185d','#0369a1','#1e293b'];

// ── STATE ──
const S={
  cat:'tecnici', weekStart:null,
  staff:[], programmi:[], turni:{},
  hiddenBuiltins:[],
  ferie:{},
  presetLayout:{fissi:[],temporanei:[]},
  presetReorder:null,
  modalStaff:false, modalProg:false, editProg:null,
  modalFerie:false,
  cellModal:null, removePrompt:null,
  presetMenu:null,
  dragging:null,
  noteColor:'#6366f1',
  _pdfUrl:null,
};

// ══════════════════════════════════════════════════════════════════════════
//  PERSISTENZA  ·  qui vivono i guardrail che impediscono di cancellare tutto
// ══════════════════════════════════════════════════════════════════════════

// Rimuove i valori `undefined` in profondità: Firestore rifiuta l'intera scrittura
// se anche un solo campo è undefined.
function sanitize(v){
  if(Array.isArray(v))return v.map(sanitize);
  if(v&&typeof v==='object'){
    const o={};
    for(const k of Object.keys(v)){
      const val=v[k];
      if(val===undefined)continue;
      o[k]=sanitize(val);
    }
    return o;
  }
  return v===undefined?null:v;
}

// ── STATO DELLA CONNESSIONE AL CLOUD ──
// Sono le tre variabili che impediscono di riscrivere il vuoto sopra i dati buoni.
let _remoteOk=false;         // la LETTURA da Firestore è riuscita?
let _remoteStaffCount=null;  // quante persone c'erano nel cloud all'ultima lettura riuscita
let _lastBackupTs=0;

function applyData(d){
  S.staff=d.staff||[];
  S.programmi=d.programmi||[];
  S.turni=d.turni||{};
  S.hiddenBuiltins=d.hiddenBuiltins||[];
  S.presetLayout=d.presetLayout||{fissi:[],temporanei:[]};
  S.ferie=d.ferie||{};
}

function currentPayload(){
  return sanitize({staff:S.staff,programmi:S.programmi,turni:S.turni,hiddenBuiltins:S.hiddenBuiltins,presetLayout:S.presetLayout,ferie:S.ferie});
}

// Indicatore visivo di sincronizzazione.
let _syncStato='saving';
function setSyncStatus(stato){
  _syncStato=stato;
  const el=document.getElementById('sync-status');
  if(!el)return;
  if(stato==='ok'){ el.textContent='● Sincronizzato'; el.style.background='#16a34a'; el.style.color='#fff'; el.title='Le modifiche vengono salvate su Firebase (cloud).'; }
  else if(stato==='saving'){ el.textContent='● Salvataggio…'; el.style.background='#f59e0b'; el.style.color='#fff'; el.title='Salvataggio in corso…'; }
  else if(stato==='readonly'){ el.textContent='● Sola lettura'; el.style.background='#334155'; el.style.color='#cbd5e1'; el.title='Stai consultando i turni. Per modificarli serve il codice.'; }
  else { el.textContent='● NON sincronizzato'; el.style.background='#dc2626'; el.style.color='#fff'; el.title='ATTENZIONE: le modifiche NON stanno arrivando al cloud.'; }
}

function mostraBannerPericolo(testo){
  const b=document.getElementById('danger-banner');
  if(!b)return;
  if(!testo){b.style.display='none';b.textContent='';return;}
  b.textContent=testo;
  b.style.display='block';
}

async function save(){
  const payload=currentPayload();
  const testo=JSON.stringify(payload);
  const nStaff=(S.staff||[]).length;

  // Copia locale immediata: rete di sicurezza su questo dispositivo.
  try{ localStorage.setItem('turni_v5_fb',testo); }catch(e){console.error('save local:',e);}

  // ── GUARDRAIL 1 ──────────────────────────────────────────────────────────
  // Non scrivere MAI sul cloud se all'avvio non siamo riusciti a leggerlo.
  // È esattamente il caso che ha cancellato i dati ad agosto 2026: lettura
  // bloccata da un ad blocker o da un attimo di rete assente, stato vuoto in
  // memoria, salvataggio del vuoto sopra i turni di tutti.
  if(!_remoteOk){
    setSyncStatus('local');
    alert('⚠️ Modifica salvata SOLO su questo dispositivo.\n\n'+
          'All\'avvio non è stato possibile leggere i dati dal cloud, quindi per sicurezza il programma NON scrive nulla: altrimenti rischierebbe di cancellare i turni di tutti.\n\n'+
          'Controlla la connessione, disattiva eventuali ad blocker su questo sito, poi ricarica la pagina.');
    return;
  }

  // ── GUARDRAIL 2 ──────────────────────────────────────────────────────────
  // Non svuotare mai. Se il cloud aveva delle persone e adesso ne abbiamo zero,
  // è un errore per definizione, non una scelta.
  if(_remoteStaffCount>0 && nStaff===0){
    setSyncStatus('local');
    alert('🛑 Salvataggio BLOCCATO per sicurezza.\n\n'+
          'Stavi per scrivere un elenco personale VUOTO sopra '+_remoteStaffCount+' persone presenti sul cloud.\n\n'+
          'Se volevi davvero azzerare tutto, usa il pulsante Ripristina. Altrimenti ricarica semplicemente la pagina.');
    return;
  }

  // ── Scrittura vera ──
  setSyncStatus('saving');
  try{
    if(!window._fbSave){ setSyncStatus('local'); console.warn('Firebase non pronto'); return; }
    const record={blob:testo, ts:Date.now(), nStaff:nStaff, nTurni:Object.keys(S.turni||{}).length};
    await window._fbSave(record);
    _remoteStaffCount=nStaff;
    setSyncStatus('ok');

    // Backup automatico sul cloud, al massimo uno ogni 10 minuti.
    const ora=Date.now();
    if(window._fbBackup && ora-_lastBackupTs>10*60*1000){
      _lastBackupTs=ora;
      window._fbBackup(record).catch(e=>console.error('backup:',e));
    }
  }catch(e){
    console.error('save firebase:',e);
    setSyncStatus('local');
    alert('⚠️ ATTENZIONE: la modifica NON è stata salvata sul cloud (solo in locale su questo dispositivo).\n\n'+
          'NON ricaricare la pagina: rischi di perdere le modifiche.\n'+
          'Controlla la connessione e riprova.\n\n'+
          'Dettaglio tecnico: '+(e&&e.message?e.message:e));
  }
}

async function load(){
  if(window._fbLoad){
    try{
      const raw=await window._fbLoad();
      _remoteOk=true;   // la lettura è riuscita, anche se il documento non esiste ancora
      if(raw){
        // Nuovo formato: dati dentro il campo `blob`. Vecchio formato: campi sparsi.
        const d=(raw.blob!==undefined)?JSON.parse(raw.blob):raw;
        applyData(d);
      }else{
        applyData({});   // database nuovo, prima installazione
      }
      _remoteStaffCount=(S.staff||[]).length;
      migrateData();normalizePresetLayout();
      return 'firebase';
    }catch(e){
      // Lettura fallita. NON si prosegue come se niente fosse: da qui in poi
      // _remoteOk resta false e ogni scrittura sul cloud è vietata.
      console.error('LETTURA CLOUD FALLITA:',e);
      _remoteOk=false;
    }
  }
  // Fallback di SOLA VISUALIZZAZIONE dalla copia locale di questo browser.
  try{ applyData(JSON.parse(localStorage.getItem('turni_v5_fb')||'{}')); }
  catch(e){ applyData({}); }
  migrateData();normalizePresetLayout();
  return 'local';
}

// Migrazione storica: ruolo "Produzione" per De Ciuceis e Coppola. Idempotente.
function migrateData(){
  let changed=false;
  const target=[
    {cognome:'de ciuceis',nome:'luca'},
    {cognome:'coppola',nome:'enrico'},
  ];
  S.staff.forEach(s=>{
    if(s.cat!=='tecnici')return;
    const cg=(s.cognome||'').trim().toLowerCase();
    const nm=(s.nome||'').trim().toLowerCase();
    const match=target.some(t=>cg===t.cognome&&nm===t.nome);
    if(match&&s.ruolo!=='Produzione'){s.ruolo='Produzione';changed=true;}
  });
  if(changed)save().catch(e=>console.error(e));
}

function scaricaBackup(){
  const testo=JSON.stringify(currentPayload(),null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([testo],{type:'application/json'}));
  a.download='turni-backup-'+toISO(new Date())+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

function ripristinaBackup(){
  if(!requireEdit())return;
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.staff))throw new Error('File non valido: manca l\'elenco del personale.');
        const nTurni=Object.keys(d.turni||{}).length;
        if(!confirm('Ripristinare "'+f.name+'"?\n\nPersone: '+d.staff.length+'\nTurni: '+nTurni+'\n\nI dati attualmente sul cloud verranno sostituiti.'))return;
        applyData(d);
        normalizePresetLayout();
        _remoteStaffCount=0;   // ripristino volontario: il guardrail 2 non deve bloccarlo
        save().then(()=>{alert('Ripristino completato.');render();});
      }catch(e){
        alert('Errore nella lettura del backup: '+(e&&e.message?e.message:e));
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

async function ripristinaDaCloud(){
  if(!requireEdit())return;
  if(!window._fbListBackups){alert('Funzione non disponibile.');return;}
  try{
    const lista=await window._fbListBackups();
    if(!lista.length){alert('Nessun backup disponibile sul cloud.');return;}
    const righe=lista.map((b,i)=>{
      let n=0;
      try{ n=(JSON.parse(b.blob).staff||[]).length; }catch(e){}
      return (i+1)+') '+new Date(b.ts).toLocaleString('it-IT')+'  ·  '+n+' persone';
    }).join('\n');
    const scelta=prompt('Backup disponibili sul cloud:\n\n'+righe+'\n\nScrivi il NUMERO del backup da ripristinare:');
    if(!scelta)return;
    const b=lista[parseInt(scelta,10)-1];
    if(!b){alert('Numero non valido.');return;}
    const d=JSON.parse(b.blob);
    const nTurni=Object.keys(d.turni||{}).length;
    if(!confirm('Ripristinare il backup del '+new Date(b.ts).toLocaleString('it-IT')+'?\n\nPersone: '+((d.staff||[]).length)+'\nTurni: '+nTurni+'\n\nI dati attuali verranno sostituiti.'))return;
    applyData(d);
    normalizePresetLayout();
    _remoteStaffCount=0;
    await save();
    alert('Ripristino completato.');
    render();
  }catch(e){
    alert('Errore: '+(e&&e.message?e.message:e));
  }
}

function presetKeyBuiltin(id){return 'b:'+id;}
function presetKeyProg(id){return 'p:'+id;}
function allPresetKeys(){
  const keys=[];
  BUILTINS.forEach(b=>{ if(!(S.hiddenBuiltins||[]).includes(b.id)) keys.push(presetKeyBuiltin(b.id)); });
  S.programmi.filter(p=>p.isRealProg!==false).forEach(pg=>keys.push(presetKeyProg(pg.id)));
  return keys;
}
function presetExists(key){
  if(key.startsWith('b:')){const id=key.slice(2);return BUILTINS.some(b=>b.id===id)&&!(S.hiddenBuiltins||[]).includes(id);}
  if(key.startsWith('p:')){const id=key.slice(2);const pg=byId(S.programmi,id);return !!pg&&pg.isRealProg!==false;}
  return false;
}
function normalizePresetLayout(){
  if(!S.presetLayout||typeof S.presetLayout!=='object')S.presetLayout={fissi:[],temporanei:[]};
  if(!Array.isArray(S.presetLayout.fissi))S.presetLayout.fissi=[];
  if(!Array.isArray(S.presetLayout.temporanei))S.presetLayout.temporanei=[];
  const seen=new Set();
  const clean=arr=>arr.filter(k=>{if(seen.has(k)||!presetExists(k))return false;seen.add(k);return true;});
  S.presetLayout.fissi=clean(S.presetLayout.fissi);
  S.presetLayout.temporanei=clean(S.presetLayout.temporanei);
  allPresetKeys().forEach(k=>{ if(!seen.has(k)){S.presetLayout.fissi.push(k);seen.add(k);} });
}
function presetInfo(key){
  if(key.startsWith('b:')){const b=BUILTINS.find(x=>x.id===key.slice(2));return b?{nome:b.nome,colore:b.colore,dtype:'builtin',did:b.id}:null;}
  const pg=byId(S.programmi,key.slice(2));return pg?{nome:pg.nome,colore:pg.colore||'#6366f1',dtype:'prog',did:pg.id}:null;
}

// ── DATE UTILS ──
function toISO(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function fromISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(iso,n){const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d)}
function getMonday(iso){const d=fromISO(iso),day=d.getDay(),diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return toISO(d)}
function getDow(iso){const day=fromISO(iso).getDay();return day===0?6:day-1}
function getMonth(iso){return fromISO(iso).getMonth()}
function fmtDate(iso){const d=fromISO(iso);return`${d.getDate()}/${d.getMonth()+1}`}
function isToday(iso){return iso===toISO(new Date())}
function isPast(iso){return iso<toISO(new Date())}
function weekDates(){return Array.from({length:7},(_,i)=>addDays(S.weekStart,i))}
function fmtWeekLabel(){const dd=weekDates(),s=fromISO(dd[0]),e=fromISO(dd[6]);return`${s.getDate()} ${MN[s.getMonth()]} – ${e.getDate()} ${MN[e.getMonth()]} ${e.getFullYear()}`}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),dy=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,dy)}
function isHoliday(iso){const d=fromISO(iso),y=d.getFullYear();const md=`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;if(['01-01','01-06','04-25','05-01','06-02','08-15','11-01','12-08','12-25','12-26'].includes(md))return true;const ea=easter(y),em=new Date(ea);em.setDate(em.getDate()+1);return toISO(ea)===iso||toISO(em)===iso}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hexToRgba(hex,alpha){if(!hex||hex.length<7)return`rgba(0,0,0,${alpha})`;let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${alpha})`}

// TURNI AUTOMATICI DISATTIVATI DEFINITIVAMENTE (su richiesta).

function getManual(pid,iso){return S.turni[`${pid}|${iso}|${S.cat}`]??null}

function isOnFerie(pid,iso){
  const ranges=(S.ferie&&S.ferie[pid])||[];
  for(const r of ranges){
    if(!r||!r.start||!r.end)continue;
    const a=r.start<=r.end?r.start:r.end, b=r.start<=r.end?r.end:r.start;
    if(iso>=a&&iso<=b)return true;
  }
  return false;
}
const FERIE_SHIFT={ferie:true,nomeImprovvisato:'FERIE',coloreNota:'#ef4444',oraInizio:'',oraFine:''};
function getShift(pid,iso){
  if(isOnFerie(pid,iso))return FERIE_SHIFT; // priorità assoluta
  const m=getManual(pid,iso);
  if(m!==null)return m.blocked?null:m;
  return null;
}
function setManual(pid,iso,val){const k=`${pid}|${iso}|${S.cat}`;if(val===null)delete S.turni[k];else S.turni[k]=val;}
function conflictCheck(pid,iso){
  const cur=getShift(pid,iso);if(!cur?.eventoId||BUILTIN_IDS.has(cur.eventoId))return null;
  const pg=byId(S.programmi,cur.eventoId);if(!pg||!pg.nome)return null;
  if(pg.nome.toLowerCase().includes('prima mattina')){
    const dow=getDow(iso);if(dow===0){const prev=getShift(pid,addDays(iso,-7));if(prev?.eventoId===cur.eventoId)return pg.nome;}
  }
  return null;
}

// ── RIORDINO PRESET ──
function presetInsertIndex(zoneEl,clientX){
  const pills=[...zoneEl.querySelectorAll('.pill')].filter(p=>p.dataset.pkey!==S.presetReorder);
  for(let i=0;i<pills.length;i++){
    const r=pills[i].getBoundingClientRect();
    if(clientX < r.left + r.width/2){ return {key:pills[i].dataset.pkey}; }
  }
  return {key:null};
}
function onPresetZoneOver(e,sezione){
  if(!S.presetReorder)return;
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('zone-over');
}
function onPresetZoneDrop(e,sezione){
  if(!S.presetReorder)return;
  e.preventDefault();e.stopPropagation();
  if(!requireEdit()){S.presetReorder=null;return;}
  const movingKey=S.presetReorder;
  const beforeKey=presetInsertIndex(e.currentTarget,e.clientX).key;
  ['fissi','temporanei'].forEach(z=>{S.presetLayout[z]=(S.presetLayout[z]||[]).filter(k=>k!==movingKey);});
  const arr=S.presetLayout[sezione];
  if(beforeKey===null){arr.push(movingKey);}
  else{const ix=arr.indexOf(beforeKey);if(ix<0)arr.push(movingKey);else arr.splice(ix,0,movingKey);}
  S.presetReorder=null;
  window._wasDragging=true;setTimeout(()=>{window._wasDragging=false;},150);
  save().catch(err=>console.error(err));render();
}

function buildCell(pid,iso){

  let inner='';
  if(sh){
    const bi=BUILTINS.find(b=>b.id===sh.eventoId);

    let t='';
    if(sh.oraInizio&&sh.oraFine){t=`${sh.oraInizio}–${sh.oraFine}`;if(sh.oraInizio2&&sh.oraFine2)t+=` / ${sh.oraInizio2}–${sh.oraFine2}`;}
    const cfl=conflictCheck(pid,iso);
    const bgCol=isImpro?hexToRgba(col,.15):hexToRgba(col,.12);
    const borderCol=col;
    const shiftEnc=encodeURIComponent(JSON.stringify(sh));
    inner=`<div class="cell-chip"
      style="border-color:${borderCol};background-color:${bgCol}"
      draggable="true"
      data-cpid="${pid}" data-ciso="${iso}" data-cshift="${shiftEnc}"
    ><div class="chip-name"><span style="overflow:hidden;text-overflow:ellipsis">${esc(nom)}</span>${cfl?`<span class="conflict-dot" title="Conflitto"></span>`:''}${isModified?`<span class="modified-dot" title="Turno modificato manualmente"></span>`:''}</div>${t?`<div class="chip-time">${t}</div>`:''}</div>`;
  }
  return`<td><div class="cell${today}"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="this.classList.remove('drag-over');dropOnCell('${pid}','${iso}')"
    onclick="onCellClick(event,'${pid}','${iso}')"
  >${inner}</div></td>`;
}

  if(window._wasDragging){window._wasDragging=false;return;}

}

// ── ACTIONS ──
function minWeekStart(){return addDays(getMonday(toISO(new Date())),-7);}
function prevWeek(){
  const target=addDays(S.weekStart,-7);
  if(target<minWeekStart()){
    alert('Non è possibile andare più indietro della settimana precedente a quella corrente.');
    return;
  }
  S.weekStart=target;ensureWeekCopied();render();
}
function nextWeek(){S.weekStart=addDays(S.weekStart,7);ensureWeekCopied();render()}
function goToday(){S.weekStart=getMonday(toISO(new Date()));ensureWeekCopied();render()}
function setTab(cat){S.cat=cat;ensureWeekCopied();render()}
function openStaff(){if(!requireEdit())return;S.modalStaff=true;render()}
function openProg(){if(!requireEdit())return;S.modalProg=true;S.editProg='list';render()}
function openFerie(){if(!requireEdit())return;S.modalFerie=true;render()}
function closeFerie(){
  Object.keys(S.ferie).forEach(pid=>{
    S.ferie[pid]=(S.ferie[pid]||[]).filter(r=>r&&r.start&&r.end);
    if(!S.ferie[pid].length)delete S.ferie[pid];
  });
  S.modalFerie=false;
  save().catch(e=>console.error(e));
  render();
}
function addFerieRange(pid){
  if(!S.ferie[pid])S.ferie[pid]=[];
  S.ferie[pid].push({start:'',end:''});
  refreshFerieOnly();
}
function removeFerieRange(pid,ix){
  if(!S.ferie[pid])return;
  S.ferie[pid].splice(ix,1);
  if(!S.ferie[pid].length)delete S.ferie[pid];
  save().catch(e=>console.error(e));
  refreshGridOnly();
  refreshFerieOnly();
}
function refreshFerieOnly(){
  const scroller=document.querySelector('.modal-ferie .ferie-scroll');
  if(!scroller){render();return;}
  const top=scroller.scrollTop;
  const tmp=document.createElement('div');
  tmp.innerHTML=modalFerie();
  const freshScroller=tmp.querySelector('.ferie-scroll');
  if(freshScroller){scroller.innerHTML=freshScroller.innerHTML;scroller.scrollTop=top;}
  else render();
}
function setFerieDate(pid,ix,field,val){
  if(!S.ferie[pid]||!S.ferie[pid][ix])return;
  S.ferie[pid][ix][field]=val;
  const r=S.ferie[pid][ix];
  if(field==='start'&&val&&!r.end){r.end=val;syncFerieInput(pid,ix,'end',val);}
  if(field==='end'&&val&&!r.start){r.start=val;syncFerieInput(pid,ix,'start',val);}
  save().catch(e=>console.error(e));
  refreshGridOnly();
}
function syncFerieInput(pid,ix,field,val){
  const sel=`.ferie-range input[data-fp="${pid}"][data-fi="${ix}"][data-ff="${field}"]`;
  const el=document.querySelector(sel);
  if(el)el.value=val;
}
function refreshGridOnly(){
  const wrap=document.getElementById('capture-area');
  if(!wrap){render();return;}
  const tmp=document.createElement('div');
  tmp.innerHTML=gridSection();
  const fresh=tmp.firstElementChild;
  wrap.replaceWith(fresh);
  bindDrag();
}
function openCell(pid,date){
  const sh=getShift(pid,date);
  if(sh&&!sh.eventoId&&sh.coloreNota) S.noteColor=sh.coloreNota;
  S.cellModal={pid,date};render();
}

  const cat=document.getElementById('s-cat').value;
  document.getElementById('s-ruolo').innerHTML=cat==='giornalisti'?'<option>Giornalista</option>':'<option>Regista</option><option>Produzione</option><option>Cameraman</option><option>Montatore</option>';
}
function addStaff(){
  const nome=(document.getElementById('s-nome').value||'').trim(),cognome=(document.getElementById('s-cognome').value||'').trim();
  if(!nome||!cognome){alert('Inserisci nome e cognome');return}
  S.staff.push({id:uid(),nome,cognome,ruolo:document.getElementById('s-ruolo').value,cat:document.getElementById('s-cat').value});
  save().catch(e=>console.error(e));render();
}
function changeStaffRole(id,nuovoRuolo){
  const p=byId(S.staff,id);if(!p)return;
  p.ruolo=nuovoRuolo;
  save().catch(e=>console.error(e));render();
}
function removeStaff(id){
  if(!confirm('Rimuovere questa persona?'))return;
  S.staff=S.staff.filter(s=>s.id!==id);
  S.programmi.forEach(pg=>{
    if(pg.rotazioni)Object.values(pg.rotazioni).forEach(arr=>{const ix=arr.indexOf(id);if(ix>=0)arr.splice(ix,1)});
    if(pg.rotazione)pg.rotazione=pg.rotazione.filter(p=>p!==id);
    if(pg.fissi)Object.keys(pg.fissi).forEach(d=>{pg.fissi[d]=(pg.fissi[d]||[]).filter(p=>p!==id)});
  });
  save().catch(e=>console.error(e));render();

  if(!S.editProg||typeof S.editProg!=='object')return;
  const f=id=>document.getElementById(id);
  if(f('pg-nome'))S.editProg.nome=f('pg-nome').value;
  if(f('pg-col'))S.editProg.colore=f('pg-col').value;
  if(f('pg-ini'))S.editProg.oraInizio=f('pg-ini').value;
  if(f('pg-fin'))S.editProg.oraFine=f('pg-fin').value;
  if(f('pg-ini2'))S.editProg.oraInizio2=f('pg-ini2').value;
  if(f('pg-fin2'))S.editProg.oraFine2=f('pg-fin2').value;
}

  render();

function togGiorno(i){readProgForm();const a=S.editProg.giorni,ix=a.indexOf(i);if(ix>=0)a.splice(ix,1);else{a.push(i);a.sort((x,y)=>x-y);}render()}
function togMese(i){readProgForm();if(!S.editProg.mesi)S.editProg.mesi=[];const a=S.editProg.mesi,ix=a.indexOf(i);if(ix>=0)a.splice(ix,1);else{a.push(i);a.sort((x,y)=>x-y);}render()}
function removeProg(id){if(!confirm('Eliminare questo programma?'))return;S.programmi=S.programmi.filter(p=>p.id!==id);normalizePresetLayout();save().catch(e=>console.error(e));render()}
function saveProg(){
  readProgForm();
  if(!S.editProg.nome.trim()){alert('Inserisci il nome');return}
  if(!S.editProg.giorni.length){alert('Seleziona almeno un giorno');return}
  const ix=S.programmi.findIndex(p=>p.id===S.editProg.id);
  if(ix>=0)S.programmi[ix]=S.editProg;else S.programmi.push(S.editProg);
  normalizePresetLayout();
  save().catch(e=>console.error(e));S.editProg='list';render();
}
function openPresetMenu(e,ptype,pid){
  if(e){e.preventDefault();e.stopPropagation();}
  if(window._wasDragging){window._wasDragging=false;return;}
  if(!requireEdit())return;
  S.presetMenu={ptype,pid};render();
}
function editPreset(){
  const{ptype,pid}=S.presetMenu;
  if(ptype==='builtin'){
    const bi=BUILTINS.find(b=>b.id===pid);if(!bi)return;
    let pg=S.programmi.find(p=>p.replacesBuiltin===bi.id);
    if(!pg){
      pg={id:uid(),nome:bi.nome,colore:bi.colore,oraInizio:bi.oraInizio,oraFine:bi.oraFine,oraInizio2:'',oraFine2:'',giorni:[0,1,2,3,4,5,6],mesi:[],turnazione:false,rotazioni:{},fissi:{},baseDate:getMonday(toISO(new Date())),isRealProg:true,replacesBuiltin:bi.id};
      S.programmi.push(pg);
    }
    const oldKey=presetKeyBuiltin(bi.id), newKey=presetKeyProg(pg.id);
    ['fissi','temporanei'].forEach(z=>{
      const arr=S.presetLayout[z]||[];const ix=arr.indexOf(oldKey);
      if(ix>=0)arr.splice(ix,1,newKey);
    });
    if(!S.hiddenBuiltins.includes(bi.id))S.hiddenBuiltins.push(bi.id);
    normalizePresetLayout();
    S.presetMenu=null;S.modalProg=true;
    S.editProg=JSON.parse(JSON.stringify(pg));if(!S.editProg.mesi)S.editProg.mesi=[];
    save().catch(e=>console.error(e));render();return;
  }
  const pg=byId(S.programmi,pid);if(!pg)return;
  S.presetMenu=null;S.modalProg=true;
  S.editProg=JSON.parse(JSON.stringify(pg));if(!S.editProg.mesi)S.editProg.mesi=[];if(!S.editProg.giorni)S.editProg.giorni=[];
  render();
}
function deletePreset(){
  const{ptype,pid}=S.presetMenu;
  if(ptype==='builtin'){
    const bi=BUILTINS.find(b=>b.id===pid);
    if(!confirm(`Eliminare definitivamente il preset "${bi?bi.nome:''}"? Sparirà dalla barra in alto.`))return;
    if(!S.hiddenBuiltins.includes(pid))S.hiddenBuiltins.push(pid);
    S.programmi=S.programmi.filter(p=>p.replacesBuiltin!==pid);
  }else{
    const pg=byId(S.programmi,pid);
    if(!confirm(`Eliminare definitivamente il programma "${pg?pg.nome:''}"?`))return;
    S.programmi=S.programmi.filter(p=>p.id!==pid);
  }
  normalizePresetLayout();
  S.presetMenu=null;save().catch(e=>console.error(e));render();
}
function saveImpro(pid,date){
  const nome=document.getElementById('im-nome').value.trim();
  const ini=document.getElementById('im-ini').value;
  const fin=document.getElementById('im-fin').value;
  const ini2=document.getElementById('im-ini2').value;
  const fin2=document.getElementById('im-fin2').value;
  const coloreNota=S.noteColor||'#6366f1';
  if(!nome&&!ini){alert('Inserisci almeno un nome o un orario');return;}
  const v={nomeImprovvisato:nome,oraInizio:ini,oraFine:fin,oraInizio2:ini2,oraFine2:fin2,coloreNota,manual:true};
  setManual(pid,date,v);
  propagateForward(pid,date,v);
  save().catch(e=>console.error(e));
  S.cellModal=null;render();
}
function clearCellPrompt(pid,date){
  setManual(pid,date,null);
  save().catch(e=>console.error(e));
  S.cellModal=null;render();
}
function confirmRemove(type){
  const{pid,date}=S.removePrompt;
  const sh=getShift(pid,date);
  const pg=byId(S.programmi,sh.eventoId);
  const person=byId(S.staff,pid);
  if(type==='day'){
    const v={blocked:true};setManual(pid,date,v);propagateForward(pid,date,v);
    save().catch(e=>console.error(e));
  }else{
    if(pg&&pg.turnazione){
      if(pg.rotazioni&&person&&pg.rotazioni[person.ruolo])pg.rotazioni[person.ruolo]=pg.rotazioni[person.ruolo].filter(id=>id!==pid);
      if(pg.rotazione)pg.rotazione=pg.rotazione.filter(id=>id!==pid);
    }else if(pg){
      const dow=getDow(date);
      if(pg.fissi&&pg.fissi[dow])pg.fissi[dow]=pg.fissi[dow].filter(id=>id!==pid);
    }
    setManual(pid,date,null);save().catch(e=>console.error(e));
  }
  S.removePrompt=null;render();
}

// ── PULIZIA MANUALE ──
function isoFromTurnoKey(k){const p=k.split('|');return p.length>=2?p[1]:null;}
function pulisciSettimaneVecchie(){
  if(!requireEdit())return;
  const limite=minWeekStart();
  const daRimuovere=[];
  for(const k of Object.keys(S.turni)){
    const iso=isoFromTurnoKey(k);
    if(!iso)continue;
    if(getMonday(iso)<limite)daRimuovere.push(k);
  }
  if(daRimuovere.length===0){
    alert('Non ci sono settimane vecchie da rimuovere. Tutto già in ordine.');
    return;
  }
  const ok=confirm('Stai per eliminare definitivamente '+daRimuovere.length+' turni delle settimane passate (prima della settimana scorsa).\n\nLe ferie NON verranno toccate.\n\nSuggerimento: prima clicca 💾 Backup.\n\nVuoi procedere?');
  if(!ok)return;
  daRimuovere.forEach(k=>delete S.turni[k]);
  save().then(()=>{ alert('Fatto: rimossi '+daRimuovere.length+' turni vecchi.'); render(); })
         .catch(e=>{ console.error(e); render(); });
}

// ── PDF ──
async function exportPDF(){
  const{jsPDF}=window.jspdf;
  const list=staffSorted(S.cat);
  const dates=weekDates();
  const pdf=new jsPDF('l','mm','a4');
  const PW=297, PH=210;
  const ML=8, MR=8, MT=18, MB=6;
  const usableW=PW-ML-MR;
  const usableH=PH-MT-MB;
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(13);
  pdf.setTextColor(30,41,59);
  pdf.text(`Programmazione Turni — ${S.cat.toUpperCase()}`,PW/2,10,{align:'center'});
  pdf.setFont('helvetica','normal');
  pdf.setFontSize(8);
  pdf.setTextColor(100,116,139);
  pdf.text(`Settimana dal ${fmtWeekLabel()}`,PW/2,15,{align:'center'});
  const maxNameLen=list.reduce((m,s)=>Math.max(m,`${s.cognome} ${s.nome}`.length),0);
  const nameColW=Math.min(55,Math.max(28,maxNameLen*1.9));
  const dayColW=(usableW-nameColW)/7;
  const headerH=9;
  const nRows=list.length;
  const rowH=Math.min(22, Math.max(10, (usableH-headerH)/nRows));
  const hdrY=MT;
  pdf.setFillColor(241,245,249);
  pdf.setDrawColor(203,213,225);
  pdf.rect(ML, hdrY, nameColW, headerH, 'FD');
  pdf.setFont('helvetica','bold');
  pdf.setFontSize(7.5);
  pdf.setTextColor(71,85,105);
  pdf.text('Nome', ML+2, hdrY+6);
  dates.forEach((d,i)=>{
    const x=ML+nameColW+i*dayColW;
    const isTod=isToday(d), isHol=isHoliday(d);
    if(isTod){ pdf.setFillColor(59,130,246); pdf.setDrawColor(37,99,235); }
    else      { pdf.setFillColor(241,245,249); pdf.setDrawColor(203,213,225); }
    pdf.rect(x, hdrY, dayColW, headerH, 'FD');
    pdf.setFont('helvetica','bold');
    pdf.setFontSize(8);
    pdf.setTextColor(isTod?255:71, isTod?255:85, isTod?255:105);
    pdf.text(GN[i]+(isHol?' *':''), x+dayColW/2, hdrY+4, {align:'center'});
    pdf.setFontSize(6.5);
    pdf.text(fmtDate(d), x+dayColW/2, hdrY+7.5, {align:'center'});
  });
  pdf.setDrawColor(203,213,225);
  list.forEach((s,ri)=>{
    const rowY=hdrY+headerH+ri*rowH;
    const bg=ri%2===0?[255,255,255]:[250,250,250];
    pdf.setFillColor(...bg);
    pdf.setDrawColor(203,213,225);
    pdf.setLineWidth(0.1);
    pdf.rect(ML, rowY, nameColW, rowH, 'FD');
    pdf.setFont('helvetica','bold');
    pdf.setFontSize(6.5);
    pdf.setTextColor(30,41,59);
    const fullName=`${s.cognome} ${s.nome}`;
    const maxChars=Math.floor(nameColW/1.95);
    const nameStr=fullName.length>maxChars?fullName.slice(0,maxChars-1)+'…':fullName;
    pdf.text(nameStr, ML+1.5, rowY+rowH/2-1.5);
    pdf.setFont('helvetica','normal');
    pdf.setFontSize(5.5);
    pdf.setTextColor(148,163,184);
    pdf.text(s.ruolo, ML+1.5, rowY+rowH/2+2.5);
    dates.forEach((iso,i)=>{
      const x=ML+nameColW+i*dayColW;
      pdf.setFillColor(...bg);
      pdf.setDrawColor(203,213,225);
      pdf.setLineWidth(0.1);
      pdf.rect(x, rowY, dayColW, rowH, 'FD');
      const sh=getShift(s.id,iso);
      if(!sh) return;
      if(sh.ferie){
        const pad=1.2;
        pdf.setFillColor(239,68,68);
        pdf.setDrawColor(220,38,38);
        pdf.setLineWidth(0.4);
        pdf.roundedRect(x+pad, rowY+pad, dayColW-pad*2, rowH-pad*2, 1, 1, 'FD');
        pdf.setLineWidth(0.1);
        pdf.setFont('helvetica','bold');
        pdf.setFontSize(6.2);
        pdf.setTextColor(255,255,255);
        pdf.text('FERIE', x+dayColW/2, rowY+rowH/2+1, {align:'center'});
        return;
      }
      const bi=BUILTINS.find(b=>b.id===sh.eventoId);
      const pg=!bi?byId(S.programmi,sh.eventoId):null;
      const col=!sh.eventoId?(sh.coloreNota||'#6366f1'):(bi?.colore||pg?.colore||'#6366f1');
      const nom=bi?.nome||pg?.nome||sh.nomeImprovvisato||'?';
      let t='';
      if(sh.oraInizio&&sh.oraFine){ t=`${sh.oraInizio}–${sh.oraFine}`; if(sh.oraInizio2&&sh.oraFine2) t+=` / ${sh.oraInizio2}–${sh.oraFine2}`; }
      const hr=parseInt(col.slice(1,3),16),hg=parseInt(col.slice(3,5),16),hb=parseInt(col.slice(5,7),16);
      const pad=1.2;
      const lightR=Math.round(hr*0.15+240*0.85), lightG=Math.round(hg*0.15+245*0.85), lightB=Math.round(hb*0.15+249*0.85);
      pdf.setFillColor(lightR,lightG,lightB);
      pdf.setDrawColor(hr,hg,hb);
      pdf.setLineWidth(0.4);
      pdf.roundedRect(x+pad, rowY+pad, dayColW-pad*2, rowH-pad*2, 1, 1, 'FD');
      pdf.setLineWidth(0.1);
      pdf.setFont('helvetica','bold');
      pdf.setFontSize(6);
      pdf.setTextColor(30,41,59);
      const cx=x+dayColW/2;
      const maxC=Math.floor((dayColW-3)/1.85);
      const nomStr=nom.length>maxC?nom.slice(0,maxC-1)+'…':nom;
      if(t){
        pdf.text(nomStr, cx, rowY+rowH/2-1, {align:'center'});
        pdf.setFont('helvetica','normal');
        pdf.setFontSize(5.2);
        pdf.setTextColor(55,65,81);
        pdf.text(t, cx, rowY+rowH/2+2.8, {align:'center'});
      } else {
        pdf.text(nomStr, cx, rowY+rowH/2+1, {align:'center'});
      }
    });
  });
  const blob=pdf.output('blob');
  if(S._pdfUrl)URL.revokeObjectURL(S._pdfUrl);
  S._pdfUrl=URL.createObjectURL(blob);
  const iframe=document.getElementById('pdf-iframe');
  document.getElementById('pdf-title').textContent=`📄 Turni – ${S.cat} – ${fmtWeekLabel()}`;
  document.getElementById('pdf-print-btn').onclick=()=>iframe.contentWindow&&iframe.contentWindow.print();
  document.getElementById('pdf-save-btn').onclick=()=>{const a=document.createElement('a');a.href=S._pdfUrl;a.download=`Turni_${S.cat}_${S.weekStart}.pdf`;a.click();};
  iframe.src=S._pdfUrl;
  document.getElementById('pdf-ui').style.display='block';
}
window.closePdfOverlay=function(){
  document.getElementById('pdf-ui').style.display='none';
};

// ── DRAG BINDING ──
function bindDrag(){
  document.querySelectorAll('.pill[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      S.dragging={type:e.currentTarget.dataset.dtype,id:e.currentTarget.dataset.did};
      S.presetReorder=e.currentTarget.dataset.pkey||null;
      e.dataTransfer.effectAllowed='copyMove';
    });
    el.addEventListener('dragend',()=>{
      window._wasDragging=true;S.dragging=null;S.presetReorder=null;
      document.querySelectorAll('.preset-zone.zone-over').forEach(z=>z.classList.remove('zone-over'));
      setTimeout(()=>{window._wasDragging=false;},150);
    });
  });
  document.querySelectorAll('.preset-zone').forEach(z=>{
    z.addEventListener('dragleave',e=>{
      if(!z.contains(e.relatedTarget))z.classList.remove('zone-over');
    });
  });
  document.querySelectorAll('.cell-chip[draggable]').forEach(el=>{
    el.addEventListener('dragstart',e=>{
      e.stopPropagation();
      let cellShift=null;
      try{ cellShift=JSON.parse(decodeURIComponent(e.currentTarget.dataset.cshift||'')); }catch(err){}
      S.dragging={type:'cell',id:null,cellShift};
      S.presetReorder=null;
      e.currentTarget.classList.add('is-dragging');
      e.dataTransfer.effectAllowed='copy';
    });
    el.addEventListener('dragend',e=>{
      e.currentTarget.classList.remove('is-dragging');
      window._wasDragging=true;
      S.dragging=null;
      setTimeout(()=>{window._wasDragging=false;},150);
    });
  });
}
